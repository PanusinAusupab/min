<html lang="th">
<head>

<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&display=swap" rel="stylesheet">
<style>
  html,body{height:100%;margin:0;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#40245b 0%,#171936 48%,#070b24 100%);font-family:'Mali','Sarabun',sans-serif;color:#fff5e6}

  .btn{border-radius:999px;padding:.7rem 1.2rem;font-weight:600;background:linear-gradient(135deg,#ffd17e,#ff9ab7 55%,#dfa3ff);color:#351b3d;box-shadow:0 7px 20px rgba(255,125,177,.18);transition:transform .15s,filter .15s}
  .btn:active{transform:scale(.96)}
  .btn2{border-radius:999px;padding:.7rem 1.2rem;font-weight:600;background:rgba(255,220,237,.1);border:1px solid rgba(255,191,218,.38);color:#fff5fb}
  .btn:disabled{opacity:.5}
  .opt{border-radius:1rem;border:2px solid transparent;background:rgba(255,255,255,.07);padding:.35rem;text-align:center;font-size:.8rem}
  .opt.sel{border-color:#ffcf7a;background:rgba(255,207,122,.16)}
  .chip{background:rgba(39,30,74,.76);border:1px solid rgba(255,191,218,.32);border-radius:999px;padding:.4rem .8rem;font-size:.85rem;min-height:40px;color:#fff3fb}
  #toast{position:fixed;z-index:20;left:50%;top:calc(env(safe-area-inset-top) + 5rem);transform:translate(-50%,-12px);opacity:0;transition:.25s;max-width:min(92vw,440px);background:rgba(51,31,74,.96);border:1px solid rgba(255,183,214,.55);border-radius:1.2rem;padding:.7rem 1rem;text-align:center;box-shadow:0 12px 35px #08051a99;pointer-events:none}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  .cute-title{background:linear-gradient(90deg,#ffe2a7,#ffacd0,#ddc2ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 5px 25px rgba(255,154,205,.14)}
  .soft-heart{position:absolute;pointer-events:none;color:#ffadd0;opacity:.18;font-size:1.5rem;animation:heartFloat 5s ease-in-out infinite}
  @keyframes heartFloat{50%{transform:translateY(-9px) rotate(8deg);opacity:.3}}
  .hidden{display:none!important}
  #ui{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  #ui>*{pointer-events:auto}
  @media(max-width:700px){
    #hud{padding:calc(env(safe-area-inset-top) + .45rem) .65rem .4rem;gap:.45rem;flex-direction:column;align-items:stretch;background:linear-gradient(180deg,rgba(7,8,31,.62),transparent)}
    #hud>div{gap:.35rem;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
    #hud>div::-webkit-scrollbar{display:none}
    .chip{min-height:42px;white-space:nowrap}
    #status{top:6.7rem;padding:0 .8rem;font-size:.78rem}
    #bottom{padding:calc(.6rem + env(safe-area-inset-bottom)) .75rem;gap:.4rem}
    #rxRow{width:100%;justify-content:center}
    #extras{left:.65rem!important;right:.65rem;bottom:6.3rem!important;max-width:none!important;max-height:56vh!important;border-radius:1.35rem;padding:1rem}
    #lobby{padding:1rem;overflow:auto;align-items:flex-start;padding-top:max(1.1rem,env(safe-area-inset-top))}
    #lobby .panel{margin:auto 0;max-height:calc(100dvh - 2rem);overflow:auto}
    #setup{padding:.6rem;align-items:flex-end}
    #setup .panel{max-height:calc(100dvh - env(safe-area-inset-top) - .8rem)!important;border-radius:1.4rem 1.4rem .8rem .8rem;padding:1rem}

  }
</style>

<body>

      <button id="btnRelease" class="btn w-full">🪷 ปล่อยกระทงลงน้ำ</button>
    </div>
  </div>

  <div id="qr" class="hidden absolute inset-0 flex items-center justify-center p-4" style="background:rgba(5,6,25,.6)">
    <div class="panel text-center"><div class="mb-2 font-semibold">สแกนเพื่อเข้าห้อง</div>
      <div id="qrBox" class="bg-white p-3 rounded-xl inline-block"></div>

</div>

<script type="module">
/* =====================================================================
   ตั้งค่า Firebase (ทำครั้งเดียว)
   1) เข้า https://console.firebase.google.com แล้วกด "Add project"
   2) เมนูซ้าย Build > Realtime Database > Create Database (เลือกโหมด Test)
   3) ไอคอนฟันเฟือง > Project settings > ส่วน "Your apps" กดไอคอน </> (Web) ตั้งชื่อแอป
   4) คัดลอกค่า firebaseConfig ที่ได้ มาวางทับด้านล่างนี้ (ต้องมี databaseURL ด้วย)
   ถ้าเว้นว่างไว้ เกมจะเข้า "โหมดทดสอบ" ให้เล่นคนเดียวกับแฟนจำลองโดยอัตโนมัติ
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyB_2-loW87Ml-rP53Uaq9LBS_FroWEwiog",
  authDomain: "katung-6970d.firebaseapp.com",
  databaseURL: "https://katung-6970d-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "katung-6970d",
  appId: "1:952888475922:web:b5d292e74da4c74fb0f3cb"
};

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const show = (id,on=true) => $(id).classList.toggle('hidden',!on);
const STYLES = ['ใบตองคลาสสิก','ดอกบัวชมพู','ขนมปังน้องหมี','มินิมอลหัวใจ'];
const CHARMS = ['🪙 เหรียญทอง','💍 แหวนหัวใจ','🎟️ คูปองตามใจแฟน 1 วัน'];
const FB_READY = !!(firebaseConfig.apiKey && firebaseConfig.databaseURL);

/* ---------- Firebase wrapper ---------- */
let FB = null;
async function initFB(){
  if(!FB_READY) return false;
  try{
    const A = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const D = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
    FB = {D, db: D.getDatabase(A.initializeApp(firebaseConfig))};
    return true;
  }catch(e){ console.warn('Firebase error',e); return false; }
}
const ref = p => FB.D.ref(FB.db,p);

/* ---------- State ---------- */
let demo=false, room=null, slot=0, collided=false, colliding=false, celeb=0, burstT=0, heartT=0;
let remoteHistory={}, paOnline=false, playerSnapshotReady=false;
const pid = localStorage.getItem('loy-player-id') || Math.random().toString(36).slice(2,11);
localStorage.setItem('loy-player-id',pid);
const mk = s => ({name:'',style:0,charm:0,wish:'',secret:'',released:false,lit:false,x:s?.8:.2,y:s?.82:.74,vx:0,vy:0,slot:s,here:false});
let me = mk(0), pa = mk(1); let bumpFlash=0;
me.stickers=[]; pa.stickers=[]; me.coupons=[]; pa.coupons=[]; me.wishlist=[]; pa.wishlist=[]; me.photo=''; me.photoShape='heart'; let pendingSticker='';
let selStyle=0, selCharm=0;
const sync = o => { if(!demo && FB && room) FB.D.update(ref(`rooms/${room}/players/${pid}`),o); };
let toastTimer=0;
function notify(message){const t=$('toast');t.textContent=message;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),3400);}
function rememberRoom(){if(!room||demo)return;localStorage.setItem('loy-last-room',room);localStorage.setItem('loy-last-name',me.name||'');}
function restorePlayer(o){
  Object.assign(me,{name:o.name||me.name,style:o.style||0,charm:o.charm||0,wish:o.wish||'',secret:o.secret||'',released:!!o.released,lit:!!o.lit,x:o.x??me.x,y:o.y??me.y,slot:o.slot??slot,stickers:o.stickers||[],coupons:o.coupons||[],wishlist:o.wishlist||[],photo:o.photo||'',photoShape:o.photoShape||'heart'});
  if(me.photo){me.photoImg=new Image();me.photoImg.src=me.photo;}
  selStyle=me.style;selCharm=me.charm;
  $('inWish').value=me.wish;$('inSecret').value=me.secret;$('inName').value=me.name;
  renderLists();
}

/* ---------- Audio (Web Audio API) ---------- */
let AC=null, muted=false, micStream=null;
function ensureAudio(){
  if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} }
  if(AC && AC.state==='suspended') AC.resume();
}
function noise(dur){
  const b=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const s=AC.createBufferSource(); s.buffer=b; return s;
}
function sfxRipple(){
  if(!AC||muted) return; const t=AC.currentTime;
  const n=noise(.3), f=AC.createBiquadFilter(), g=AC.createGain();
  f.type='bandpass'; f.Q.value=3; f.frequency.setValueAtTime(900,t); f.frequency.exponentialRampToValueAtTime(300,t+.25);
  g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.001,t+.28);
  n.connect(f); f.connect(g); g.connect(AC.destination); n.start(t);
  const o=AC.createOscillator(), og=AC.createGain();
  o.frequency.setValueAtTime(520,t); o.frequency.exponentialRampToValueAtTime(170,t+.12);
  og.gain.setValueAtTime(.1,t); og.gain.exponentialRampToValueAtTime(.001,t+.14);
  o.connect(og); og.connect(AC.destination); o.start(t); o.stop(t+.15);
}
function sfxFirework(){
  if(!AC||muted) return; const t=AC.currentTime;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(40,t+.3);
  g.gain.setValueAtTime(.3,t); g.gain.exponentialRampToValueAtTime(.001,t+.35);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+.4);
  const n=noise(.7), f=AC.createBiquadFilter(), ng=AC.createGain();
  f.type='highpass'; f.frequency.value=2200;
  ng.gain.setValueAtTime(.001,t); ng.gain.linearRampToValueAtTime(.22,t+.12); ng.gain.exponentialRampToValueAtTime(.001,t+.7);
  n.connect(f); f.connect(ng); ng.connect(AC.destination); n.start(t);
}
function sfxChime(){
  if(!AC||muted) return;
  [784,1175,1568].forEach((fr,i)=>{
    const t=AC.currentTime+i*.12, o=AC.createOscillator(), g=AC.createGain();
    o.frequency.value=fr; g.gain.setValueAtTime(.001,t); g.gain.linearRampToValueAtTime(.12,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+.5);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+.55);
  });
}

/* ---------- Canvas & drawing ---------- */
const cv=$('stage'), ctx=cv.getContext('2d');
let W=0,H=0;
function resize(){
  const d=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight;
  cv.width=W*d; cv.height=H*d; ctx.setTransform(d,0,0,d,0,0);
}
addEventListener('resize',resize); resize();

const stars=Array.from({length:90},()=>({x:Math.random(),y:Math.random()*.48,f:1+Math.random()*2,p:Math.random()*6,r:Math.random()*1.3+.3}));
const flies=Array.from({length:22},()=>({x:Math.random(),y:.2+Math.random()*.65,p:Math.random()*6,sp:.3+Math.random()*.6}));
let ripples=[], parts=[], hearts=[];

function ell(c,x,y,rx,ry,col){ c.fillStyle=col; c.beginPath(); c.ellipse(x,y,rx,ry,0,0,Math.PI*2); c.fill(); }
function heartPath(c,x,y,s){
  c.beginPath(); c.moveTo(x,y+s*.3);
  c.bezierCurveTo(x-s,y-s*.3,x-s*.5,y-s*1.1,x,y-s*.5);

}

function addRipple(px,py){

  const now=performance.now(); if(now-lastRip<35) return; lastRip=now;
  ripples.push({x:px,y:py,r:6,a:1}); sfxRipple();
  const kx=me.x*W, ky=me.y*H, dx=kx-px, dy=ky-py, d=Math.hypot(dx,dy)||1, R=170;

  }
}

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function card(from,to,p){
  return `<div class="rounded-2xl p-3" style="background:rgba(255,255,255,.08)">
    <div class="text-sm opacity-80">💌 ${esc(from)} เขียนถึง ${esc(to)}</div>
    <div class="my-1">${esc(p.secret)}</div>
    <div class="text-sm" style="color:#ffd98a">ของมงคลที่ซ่อนไว้: ${CHARMS[p.charm]||''}</div></div>`;
}
function showReveal(){

/* ---------- Memory Polaroid ---------- */
function wrap(c,text,x,y,maxW,lh,maxLines){
  const chars=[...text]; let line='', n=0;
  for(const ch of chars){
    if(c.measureText(line+ch).width>maxW){ c.fillText(line,x,y); y+=lh; line=ch; if(++n>=maxLines-1) break; }
    else line+=ch;
  }
  const rest=chars.slice(chars.indexOf(line[0])).length; // กันบรรทัดสุดท้ายยาวเกิน
  while(c.measureText(line).width>maxW && line.length>1) line=line.slice(0,-1);
  c.fillText(line,x,y);
}
async function savePolaroid(){
  try{ await document.fonts.load('600 40px Mali'); }catch(e){}
  const PW=900, PH=1150, c=document.createElement('canvas'); c.width=PW; c.height=PH;
  const x=c.getContext('2d');
  x.fillStyle='#fbf6ea'; x.fillRect(0,0,PW,PH);
  x.strokeStyle='rgba(0,0,0,.08)'; x.lineWidth=4; x.strokeRect(2,2,PW-4,PH-4);
  const px=60,py=60,pw=780,ph=780;
  x.save(); x.beginPath(); x.rect(px,py,pw,ph); x.clip();
  let g=x.createLinearGradient(0,py,0,py+ph*.5); g.addColorStop(0,'#070b24'); g.addColorStop(.6,'#20195a'); g.addColorStop(1,'#533079');
  x.fillStyle=g; x.fillRect(px,py,pw,ph*.55);
  for(let i=0;i<70;i++){ x.fillStyle=`rgba(255,255,255,${.3+Math.random()*.6})`; x.fillRect(px+Math.random()*pw,py+Math.random()*ph*.5,2,2); }
  ell(x,px+pw*.74,py+130,50,50,'#fff6d8');
  g=x.createLinearGradient(0,py+ph*.5,0,py+ph); g.addColorStop(0,'#2a2870'); g.addColorStop(1,'#080c2e');
  x.fillStyle=g; x.fillRect(px,py+ph*.5,pw,ph*.5);
  for(let i=0;i<30;i++){ x.fillStyle=`rgba(255,238,190,${.4-i*.011})`; const w=14+i*3; x.fillRect(px+pw*.74-w/2,py+ph*.5+i*13,w,3); }
  x.globalCompositeOperation='lighter';
  const gl=x.createRadialGradient(px+pw/2,py+ph*.68,0,px+pw/2,py+ph*.68,300); gl.addColorStop(0,'rgba(255,190,90,.35)'); gl.addColorStop(1,'rgba(255,190,90,0)');
  x.fillStyle=gl; x.fillRect(px,py,pw,ph); x.globalCompositeOperation='source-over';
  drawK(x,me.slot?pa.style:me.style,px+pw*.34,py+ph*.68,78,true,1);
  drawK(x,me.slot?me.style:pa.style,px+pw*.66,py+ph*.68,78,true,2);
  x.fillStyle='rgba(255,100,140,.9)'; heartPath(x,px+pw/2,py+ph*.42,34); x.fill();
  x.fillStyle='rgba(255,100,140,.6)'; heartPath(x,px+pw/2-70,py+ph*.33,18); x.fill(); heartPath(x,px+pw/2+66,py+ph*.3,22); x.fill();
  x.restore();
  const left=me.slot?pa:me, right=me.slot?me:pa;
  x.textAlign='center'; x.fillStyle='#3a2a2a';
  x.font='600 52px Mali,sans-serif'; x.fillText(`${left.name} ❤ ${right.name}`,PW/2,PH-215);
  x.font='400 30px Mali,sans-serif'; x.fillStyle='#7a5a4a';
  x.fillText(new Date().toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'})+' • ลอยกระทง',PW/2,PH-165);
  x.font='400 28px Mali,sans-serif'; x.fillStyle='#4a3a3a';
  wrap(x,`${left.name}: ${left.wish}`,PW/2,PH-110,760,36,1);
  wrap(x,`${right.name}: ${right.wish}`,PW/2,PH-66,760,36,1);
  c.toBlob(b=>{
    const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='loy-krathong-memory.png';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  },'image/png');
}
$('btnSave').onclick=savePolaroid;
